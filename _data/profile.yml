short_bio: >-
  <p>
    My research focuses on developing <strong>trustworthy multimodal AI</strong>
    that models and proactively detects real-world risks, while providing
    <strong>evidence-grounded explanations</strong> to support timely intervention.
  </p>
  
  <p>
    By connecting risk detection with actionable decision support, I aim to
    translate AI-based insights into effective real-world interventions that
    help people live <strong>safer, fairer, and more fulfilling lives</strong>.
  </p>

