<div class="mt-4">
    <h5 class="font-weight-bold mb-3">Latest News</h5>

    {% for news in site.data.news %}
    <div
        class="py-3 {% unless forloop.last %}border-bottom{% endunless %}"
    >
        <div class="row">

            <!-- Date -->
            <div class="col-md-2 mb-1 mb-md-0">
                <span
                    class="small font-weight-bold"
                    style="color: #315b7d;"
                >
                    {{ news.date }}
                </span>
            </div>

            <!-- Content -->
            <div class="col-md-10">

                <div class="font-weight-bold mb-1">
                    {{ news.title }}
                </div>

                {% if news.description %}
                <div class="small text-muted mb-1">
                    {{ news.description }}
                </div>
                {% endif %}

                {% if news.links %}
                <div class="small">
                    {% for link in news.links %}
                    <a
                        href="{{ link[1] }}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="mr-2"
                    >
                        [{{ link[0] }}]
                    </a>
                    {% endfor %}
                </div>
                {% endif %}

            </div>

        </div>
    </div>
    {% endfor %}
</div>
